name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  # Everything must build without cgo. If a dependency needs it, it is the
  # wrong dependency — cgo is what would break the single-machine cross-compile.
  CGO_ENABLED: "0"

jobs:
  test:
    # Run on all three, not just Linux. The build matrix below cross-compiles
    # six targets, and cross-compiling never executes a test — so for a long
    # while the suite only ever RAN on Linux, and a test asserting Windows path
    # semantics passed locally and failed here. The reverse blind spot is the
    # same size: a Unix-only assumption would pass CI and break on a laptop.
    #
    # Path separators, case-insensitive filesystems, file locking and line
    # endings all differ, and this tool walks filesystems for a living.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # "stable", not a pinned number and not go.mod's version. The go
          # directive is a *floor* — building with exactly that release means
          # building with an unpatched toolchain, and govulncheck rightly fails
          # it: go1.25.0 ships crypto/tls and net/textproto vulnerabilities that
          # are reachable from this binary's own HTTP server. A pinned number
          # also breaks the moment a dependency raises its requirement.
          go-version: stable
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Once, on Linux. Formatting does not vary by platform, and the shell
      # here is sh — the Windows runner would need its own spelling of it for
      # no extra signal.
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

  vuln:
    # This tool exists because dependency trees get compromised. Not scanning
    # its own would be the joke telling itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # "stable", not a pinned number and not go.mod's version. The go
          # directive is a *floor* — building with exactly that release means
          # building with an unpatched toolchain, and govulncheck rightly fails
          # it: go1.25.0 ships crypto/tls and net/textproto vulnerabilities that
          # are reachable from this binary's own HTTP server. A pinned number
          # also breaks the moment a dependency raises its requirement.
          go-version: stable
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  cross-compile:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # "stable", not a pinned number and not go.mod's version. The go
          # directive is a *floor* — building with exactly that release means
          # building with an unpatched toolchain, and govulncheck rightly fails
          # it: go1.25.0 ships crypto/tls and net/textproto vulnerabilities that
          # are reachable from this binary's own HTTP server. A pinned number
          # also breaks the moment a dependency raises its requirement.
          go-version: stable
          check-latest: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="pkgwatch-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && out="${out}.exe"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X github.com/myselfvivek17/pkgwatch/internal/buildinfo.Version=${GITHUB_REF_NAME} \
              -X github.com/myselfvivek17/pkgwatch/internal/buildinfo.Commit=${GITHUB_SHA::8}" \
            -o "dist/${out}" ./cmd/pkgwatch
          ls -lh "dist/${out}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkgwatch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
